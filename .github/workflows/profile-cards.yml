# Renders the README's activity cards from the GitHub API and commits them as SVGs.
#
# The point is reliability: shared card services (github-readme-stats,
# github-profile-summary-cards, activity-graph) run on other people's rate limit,
# and when they exhaust it the README shows an empty box — GitHub's image proxy
# then caches that failure for hours. Here the data is fetched with this repo's own
# GITHUB_TOKEN, rendered to SVG, and served from the repo itself. Nothing to
# rate-limit at page-load time, and a bad API day falls back to assets/data.json.
name: Profile cards

on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/profile-cards.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: node scripts/generate-cards.mjs

      - name: Commit if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets
          if git diff --staged --quiet; then
            echo 'Cards unchanged.'
          else
            git commit -m 'chore(cards): refresh profile activity cards'
            git push
          fi
