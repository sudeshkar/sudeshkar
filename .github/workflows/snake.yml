# Generates the contribution-graph snake animation into the `output` branch.
# Same reasoning as profile-cards.yml: the SVG is built here and served from this
# repo, so the README never depends on a third-party renderer being up.
name: Contribution snake

on:
  schedule:
    - cron: '43 */12 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/snake.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#0e7490&color_dots=#eaeef2,#6cc7db,#0e7490,#4338ca,#6d28d9
            dist/snake-dark.svg?color_snake=#22d3ee&color_dots=#161b22,#0c3644,#0e7490,#22d3ee,#a78bfa

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
