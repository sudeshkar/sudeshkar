<title>Hi, I'm Sudeshkar. Full-stack engineer in Sri Lanka. I build backends in Java 21 and Spring Boot, with C# and React on top. 15 pull requests merged into OpenMRS so far. Right now I am building SkyHub, DocBot and FreshLink. Open to backend and full-stack roles: sudeshkar008sk@gmail.com</title>
<defs>
