<svg xmlns="http://www.w3.org/2000/svg" width="480" height="238" viewBox="0 0 480 238" role="img" aria-label="Most used languages">
<title>Language mix across 17 public repositories</title>
<defs>
  <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#010409"/></linearGradient>
  <clipPath id="lframe"><rect width="480" height="238" rx="14"/></clipPath>
  <clipPath id="barclip"><rect x="22" y="66" width="436" height="12" rx="6"/></clipPath>
  <pattern id="ldots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.045"/></pattern>
  <style>
    
  @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  @keyframes drift { 0%,100% { transform:translate(0,0); } 50% { transform:translate(18px,-12px); } }
  @keyframes drift2 { 0%,100% { transform:translate(0,0); } 50% { transform:translate(-22px,14px); } }
  @keyframes sweep { 0% { transform:translateX(-100%); } 100% { transform:translateX(100%); } }
  @keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
  @keyframes spinBack { from { transform:rotate(360deg); } to { transform:rotate(0deg); } }
  @keyframes pulse { 0%,100% { opacity:.35; r:4; } 50% { opacity:1; r:5.5; } }
  @keyframes dash { to { stroke-dashoffset:0; } }
  .rise { opacity:0; animation:rise .7s cubic-bezier(.22,.8,.3,1) forwards; }
  .fade { opacity:0; animation:fade .8s ease forwards; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration:.001s !important; animation-delay:0s !important; }
    .rise, .fade { opacity:1; }
  }

    @keyframes growX { from { transform:scaleX(0); } to { transform:scaleX(1); } }
    .t { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; } .m { font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
    .seg { transform-origin:22px 0; transform:scaleX(0); animation:growX 1.1s cubic-bezier(.22,.8,.3,1) forwards; }
    .shine { animation:sweep 4.5s cubic-bezier(.4,0,.2,1) 1.2s infinite; }
  </style>
</defs>
<g clip-path="url(#lframe)">
  <rect width="480" height="238" fill="url(#lbg)"/>
  <rect width="480" height="238" fill="url(#ldots)"/>
  <text class="t" x="22" y="34" font-size="14" font-weight="700" fill="#e6edf3">Language mix</text>
  <text class="m" x="458" y="34" text-anchor="end" font-size="10" letter-spacing="1.2" fill="#586069">BY BYTES · 17 REPOS · EXCL. NOTEBOOKS</text>
  <rect x="22" y="46" width="436" height="1" fill="#1c242d"/>

  <rect x="22" y="66" width="436" height="12" rx="6" fill="#161b22"/>
  <g clip-path="url(#barclip)">
    <rect class="seg" x="22.00" y="66" width="182.48" height="12" fill="#b07219" style="transform-origin:22.00px 0; animation-delay:0.10s"/>
    <rect class="seg" x="204.48" y="66" width="90.00" height="12" fill="#178600" style="transform-origin:204.48px 0; animation-delay:0.16s"/>
    <rect class="seg" x="294.49" y="66" width="76.44" height="12" fill="#f1e05a" style="transform-origin:294.49px 0; animation-delay:0.22s"/>
    <rect class="seg" x="370.93" y="66" width="61.68" height="12" fill="#3178c6" style="transform-origin:370.93px 0; animation-delay:0.28s"/>
    <rect class="seg" x="432.61" y="66" width="17.76" height="12" fill="#663399" style="transform-origin:432.61px 0; animation-delay:0.34s"/>
    <rect class="seg" x="450.38" y="66" width="3.60" height="12" fill="#3572A5" style="transform-origin:450.38px 0; animation-delay:0.40s"/>
    <rect class="seg" x="453.98" y="66" width="3.58" height="12" fill="#e34c26" style="transform-origin:453.98px 0; animation-delay:0.46s"/>
    <rect class="seg" x="457.56" y="66" width="1.50" height="12" fill="#384d54" style="transform-origin:457.56px 0; animation-delay:0.52s"/>
    <rect class="shine" x="22" y="66" width="70" height="12" fill="#ffffff" fill-opacity="0.16"/>
  </g>

  <g class="rise" style="animation-delay:0.24s">
    <circle cx="27" cy="100" r="5" fill="#b07219"/>
    <text class="t" x="40" y="104" font-size="12" font-weight="600" fill="#e6edf3">Java</text>
    <text class="m" x="214" y="104" text-anchor="end" font-size="11" fill="#8b949e">41.9%</text>
  </g>
