    <text class="m" x="214" y="194" text-anchor="end" font-size="11" fill="#8b949e">0.8%</text>
  </g>
  <g class="rise" style="animation-delay:0.59s">
    <circle cx="245" cy="190" r="5" fill="#384d54"/>
    <text class="t" x="258" y="194" font-size="12" font-weight="600" fill="#e6edf3">Dockerfile</text>
    <text class="m" x="432" y="194" text-anchor="end" font-size="11" fill="#8b949e">0.1%</text>
  </g>
  <rect x="0.5" y="0.5" width="479" height="237" rx="14" fill="none" stroke="#26303b"/>
</g>
