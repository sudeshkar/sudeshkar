    <text class="m" x="214" y="134" text-anchor="end" font-size="11" fill="#8b949e">17.5%</text>
  </g>
  <g class="rise" style="animation-delay:0.39s">
    <circle cx="245" cy="130" r="5" fill="#3178c6"/>
    <text class="t" x="258" y="134" font-size="12" font-weight="600" fill="#e6edf3">TypeScript</text>
    <text class="m" x="432" y="134" text-anchor="end" font-size="11" fill="#8b949e">14.1%</text>
  </g>
  <g class="rise" style="animation-delay:0.44s">
    <circle cx="27" cy="160" r="5" fill="#663399"/>
    <text class="t" x="40" y="164" font-size="12" font-weight="600" fill="#e6edf3">CSS</text>
    <text class="m" x="214" y="164" text-anchor="end" font-size="11" fill="#8b949e">4.1%</text>
  </g>
  <g class="rise" style="animation-delay:0.49s">
    <circle cx="245" cy="160" r="5" fill="#3572A5"/>
    <text class="t" x="258" y="164" font-size="12" font-weight="600" fill="#e6edf3">Python</text>
    <text class="m" x="432" y="164" text-anchor="end" font-size="11" fill="#8b949e">0.8%</text>
  </g>
  <g class="rise" style="animation-delay:0.54s">
    <circle cx="27" cy="190" r="5" fill="#e34c26"/>
